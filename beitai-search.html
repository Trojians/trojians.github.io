<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备胎小说检索</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --line:#e6e8ec; --text:#1f2430; --sub:#6b7280;
    --primary:#2563eb; --primary-weak:#eaf0ff; --mark:#ffe58a; --chip:#f0f2f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
  header{padding:6px 2px 14px}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .sub{margin:6px 0 0;color:var(--sub);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .searchbar{display:flex;gap:10px;align-items:center}
  #q{
    flex:1;min-width:0;height:46px;padding:0 14px;font-size:16px;color:var(--text);
    border:1px solid #d6dae2;border-radius:10px;background:#fbfcfe;outline:none;transition:.15s;
  }
  #q:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  button{
    height:46px;padding:0 18px;border-radius:10px;border:1px solid #d6dae2;background:#fff;color:var(--text);
    font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;
  }
  button:hover{border-color:#b9c0cc;background:#f7f9fc}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{background:#1d4fd8}
  .options{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:10px;color:var(--sub);font-size:13px}
  .options label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .options input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
  .kbd{display:inline-block;padding:1px 6px;border:1px solid #d6dae2;border-bottom-width:2px;border-radius:5px;background:#fff;font-size:12px;color:#4b5563}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--chip);color:#374151;font-size:13px;cursor:pointer;transition:.15s;user-select:none;
  }
  .chip:hover{background:#e8ebf2}
  .chip .n{color:var(--sub);font-size:12px}
  .chip.active{background:var(--primary-weak);border-color:#bcd0ff;color:#1d4fd8;font-weight:600}
  .chip.active .n{color:#3b6fe0}
  .status{margin:16px 2px 10px;color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
  .status b{color:var(--text);font-size:15px}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{
    position:sticky;top:0;z-index:2;background:#f7f8fb;text-align:left;font-weight:600;color:#4b5563;
    font-size:13px;padding:11px 12px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:10px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top;word-break:break-all}
  tbody tr:hover{background:#fafbff}
  tbody tr:last-child td{border-bottom:none}
  .c-title{font-size:14px;color:#141a26;font-weight:600}
  .c-folder{white-space:nowrap}
  .folder-badge{display:inline-block;padding:2px 9px;border-radius:6px;background:#eef2f9;color:#33507d;font-size:12px;font-weight:600}
  .c-name{color:#4b5563;font-size:13px;cursor:copy}
  .c-name:hover{color:var(--primary)}
  .c-size{white-space:nowrap;color:var(--sub);font-size:13px;text-align:right}
  mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
  .empty{padding:52px 20px;text-align:center;color:var(--sub)}
  .empty .big{font-size:16px;color:#374151;margin-bottom:8px}
  .more{display:flex;justify-content:center;margin-top:16px}
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(12px);
    background:#1f2430;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;
    pointer-events:none;transition:.2s;z-index:99;
  }
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){
    .wrap{padding:14px 10px 40px}
    h1{font-size:19px}
    #q{height:42px;font-size:15px}
    button{height:42px;padding:0 14px}
    table col.col-name, table col.col-size{width:0}
    thead th:nth-child(3),tbody td:nth-child(3){display:none}
    thead th:nth-child(4),tbody td:nth-child(4){display:none}
    thead th:nth-child(1){width:66%}
    thead th:nth-child(2){width:34%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>备胎小说检索</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <div class="panel">
    <div class="searchbar">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="输入小说名 / 作者 / 文件名关键字…（支持多个关键字，空格分隔）">
      <button id="clear" type="button">清空</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="cs"> 区分大小写</label>
      <span>快捷键：<span class="kbd">Ctrl</span> + <span class="kbd">F</span> 或 <span class="kbd">/</span> 聚焦输入框，<span class="kbd">Esc</span> 清空</span>
      <span>支持带参打开：在地址后加 <span class="kbd">?q=关键词&amp;f=备胎-3</span></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="tablewrap">
    <table>
      <colgroup>
        <col class="col-title" style="width:38%">
        <col class="col-folder" style="width:11%">
        <col class="col-name" style="width:41%">
        <col class="col-size" style="width:10%">
      </colgroup>
      <thead>
        <tr><th>小说名</th><th>所在文件夹</th><th>原始文件名（点击复制）</th><th style="text-align:right">大小</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none"></div>
  </div>

  <div class="more" id="moreWrap" style="display:none">
    <button id="more" type="button">加载更多</button>
  </div>
</div>
<div class="toast" id="toast"></div>

        '<td class="c-title">' + highlight(r.title, state.tokens, state.cs) + '</td>' +
        '<td class="c-folder"><span class="folder-badge">' + esc(META.folders[r.fi].name) + '</span></td>' +
        '<td class="c-name" title="点击复制原始文件名">' + highlight(r.name, state.tokens, state.cs) + '</td>' +
        '<td class="c-size">' + fmtSize(r.size) + '</td>' +
        '</tr>');
    }
    $tbody.insertAdjacentHTML('beforeend', html.join(''));
    state.shown = end;
    renderMore();

    if (!state.results.length){
      $empty.style.display = 'block';
      $empty.innerHTML = '<div class="big">没有匹配的小说</div>' +
        '<div>换个关键词试试：可只输入书名中的几个字，或输入作者笔名。</div>' +
        ($cs.checked ? '<div style="margin-top:6px">当前已开启「区分大小写」，可关闭后再试。</div>' : '');
    }
  }

  /* ---------------- 事件 ---------------- */
  var timer = null;
  function onInput(){
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){
      state.raw = $q.value.trim();
      state.tokens = state.raw ? state.raw.split(/\s+/).filter(Boolean) : [];
      state.cs = $cs.checked;
      search();
      appendPage();
    }, 60);
  }

  $q.addEventListener('input', onInput);
  $cs.addEventListener('change', function(){
    state.cs = $cs.checked;
    search();
    appendPage();
  });
  $clear.addEventListener('click', function(){
    $q.value = '';
    state.raw = '';
    state.tokens = [];
    state.folder = null;
    search();
    appendPage();
    $q.focus();
  });
  $more.addEventListener('click', appendPage);

  $chips.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('.chip') : null;
    if (!el) return;
    var f = parseInt(el.getAttribute('data-f'), 10);
    state.folder = (f < 0) ? null : f;
    search();
    appendPage();
  });

  $tbody.addEventListener('click', function(e){
    var td = e.target.closest ? e.target.closest('td.c-name') : null;
    if (!td) return;
    // 通过行号定位记录
    var tr = td.parentNode;
    var rowIndex = Array.prototype.indexOf.call($tbody.children, tr);
    var item = state.results[rowIndex];
    if (item) copyText(item.r.name);
  });

  document.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')){
      e.preventDefault();
      $q.focus();
      $q.select();
      return;
    }
    if (!typing && e.key === '/'){
      e.preventDefault();
      $q.focus();
      return;
    }
    if (e.key === 'Escape'){
      if ($q.value){ $clear.click(); }
      else { $q.blur(); }
    }
  });

  /* ---------------- 初始化 ---------------- */
  (function initFromUrl(){
    try {
      var qs = (location.search || '').replace(/^\?/, '');
      if (!qs && location.hash.indexOf('?') > -1) qs = location.hash.split('?')[1];
      var sp = new URLSearchParams(qs);
      var qv = sp.get('q');
      if (qv){
        $q.value = qv;
        state.raw = qv.trim();
        state.tokens = state.raw ? state.raw.split(/\s+/).filter(Boolean) : [];
      }
      if (sp.get('cs') === '1'){ $cs.checked = true; state.cs = true; }
      var fv = sp.get('f');
      if (fv !== null && fv !== ''){
        for (var i = 0; i < META.folders.length; i++){
          if (META.folders[i].name === fv || String(i) === fv){ state.folder = i; break; }
        }
      }
    } catch (e) { /* file:// 下参数不可用时忽略 */ }
  })();

  renderChips();
  search();
  appendPage();
})();
</script>
</body>
</html>
